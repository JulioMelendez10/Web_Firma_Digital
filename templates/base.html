<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Web Firma Digital{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Web Firma Digital</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/documents/">Documentos</a>
                <a class="nav-link" href="/certificates/">Certificados</a>
                <a class="nav-link" href="/signatures/">Firmas</a>
                <a class="nav-link" href="/logs/">Historial</a>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-light text-center py-3 mt-4">
        <div class="container">
            <small>Proyecto Web Firma Digital - Estructura inicial</small>
        </div>
    </footer>
</body>
</html>
